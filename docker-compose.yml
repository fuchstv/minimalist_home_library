services:
  # -------------------------------------------------------------
  # HAUSBIBLIOTHEK CONTAINERS (Stack)
  # -------------------------------------------------------------
  backend:
    build: ./backend
    container_name: library_backend
    restart: always
    environment:
      - DB_PATH=/var/www/html/data/database.sqlite
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/uploads
    networks:
      - default
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.30
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M

  # -------------------------------------------------------------
  # REVERSE PROXY (Capacity Budget Allocation)
  # -------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/caddy
      - /var/www/beta:/var/www/beta:ro
      - /var/www/production:/var/www/production:ro
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - default
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M

volumes:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: minimalist_home_library_library_net
